appId: com.fleek.app
productName: Fleek
copyright: Fleek

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  - '!**/*.map'

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # No code-signing certificate. SmartScreen will warn on first run; see README.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fleek
  artifactName: Fleek-Setup-${version}.exe

# Auto-update is deliberately deferred; there is no publish target.
publish: null
